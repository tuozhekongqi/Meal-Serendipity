<!doctype html>
<html lang="zh-CN" data-theme="quick">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F4F3">
  <meta name="description" content="Meal-Serendipity 根据人数、场景、预算和口味提供清晰的用餐参考。">
  <title>Meal-Serendipity · 人间有味是清欢</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/components.css">
  <link rel="stylesheet" href="./src/styles/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="Meal-Serendipity 首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span>Meal<span>·</span>Serendipity</span>
      </a>
      <div class="header-actions">
        <span class="mode-pill" id="header-mode"><span aria-hidden="true"></span>菜品参考</span>
        <button class="button button-quiet button-small" type="button" id="data-info-button">数据与隐私</button>
      </div>
    </div>
  </header>
  <main id="main-content" class="app-main">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">用餐推荐</p>
      <h1 id="page-title">人间有味是清欢</h1>
      <p class="hero-copy">从人数与场景出发，再按预算与口味收拢选择。</p>
    </section>
    <div class="decision-layout">
      <section class="decision-panel" aria-labelledby="decision-title">
        <div class="section-heading">
          <div><p class="section-kicker">本次用餐</p><h2 id="decision-title">循味而选</h2></div>
          <button class="button button-quiet button-small" type="button" id="reset-button" hidden>重新选择</button>
        </div>
        <div id="mode-notice" class="mode-notice" role="status">
          <span class="notice-icon" aria-hidden="true">i</span>
          <p><strong>菜品参考</strong><span>来自项目内置清单，实际配料请在用餐前确认。</span></p>
        </div>
        <form id="recommendation-form" novalidate>
          <div id="input-flow"></div>
          <div id="desktop-actions" class="form-actions"></div>
        </form>
      </section>
      <section class="result-panel" id="result-panel" aria-labelledby="result-region-title">
        <h2 class="visually-hidden" id="result-region-title">推荐结果</h2>
        <div id="result-content" aria-live="polite" aria-atomic="false"></div>
      </section>
    </div>
  </main>
  <div class="mobile-action-bar" id="mobile-actions" aria-label="当前步骤操作"></div>
  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
  <div id="dialog-root"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
